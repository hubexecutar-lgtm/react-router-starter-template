<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef,useCallback}=React;
const DB=JSON.parse(document.getElementById('data').textContent);

/* ---------- utilitários ---------- */
const cx=(...a)=>a.filter(Boolean).join(' ');
function useHash(){
  const [h,setH]=useState(location.hash||'#/');
  useEffect(()=>{const f=()=>setH(location.hash||'#/');window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  return h;
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}
  }
}
function asciiDetail(k){
  const a=DB.areas.find(x=>x.id===k.area_id);const L=[];const P=s=>L.push(s);
  P(k.id);P(k.title);P('|');
  P('+-- AREA');P('|   +-- '+a.id+' — '+a.title);P('|');
  P('+-- 3P');P('|   |');
  P('|   +-- PROBLEMA');P('|   |   +-- '+k.p);
  P('|   +-- PROCESSO');P('|   |   +-- '+k.pr);
  P('|   +-- PROGRESSO');P('|       +-- '+k.pg);P('|');
  P('+-- PDCPA / EXECUÇÃO');P('|   |');
  P('|   +-- PDCPA: TBD (expansão canônica ainda não definida)');
  k.steps.forEach((s,i)=>P('|   +-- 0'+(i+1)+' '+s));P('|');
  P('+-- FUNÇÃO DE GESTÃO');P('|   |');P('|   +-- Principal');P('|   |   +-- '+k.gname+' (nível '+k.glevel+')');P('|   +-- Secundárias');P('|       +-- TBD');P('|');
  P('+-- FUNÇÕES EXECUTIVAS');P('|   |');P('|   +-- Primária: '+k.cog);P('|   +-- Secundárias: TBD');P('|');
  P('+-- VULNERABILIDADES');P('|   |');
  k.vul.forEach((v,i)=>{P('|   +-- '+v.id);P('|   '+(i<k.vul.length-1?'|':' ')+'   +-- '+v.nome)});P('|');
  P('+-- EVIDÊNCIAS');P('|   |');P('|   +-- EVIDENCE_GAP');P('|       +-- Sem fonte verificável registrada; nada foi inventado.');P('|');
  P('+-- IMPACTO OPERACIONAL');P('|   |');P('|   +-- NEGATIVO');P('|   |   +-- '+k.neg+' ('+k.cons+')');P('|   +-- POSITIVO');P('|       +-- '+k.pos);P('|');
  P('+-- SLASH COMMANDS');P('|   |');P('|   +-- '+k.cmd);P('|       +-- aciona '+k.id);P('|');
  P('+-- RASTREABILIDADE');P('    +-- fonte: '+k.src);P('    +-- plugin: '+k.plugin);P('    +-- tipo: '+k.kind);P('    +-- classificação: PROPOSTA (derivada da descrição)');P('    +-- versão: 1.0.0 · status: '+k.status);P('    +-- última revisão: '+DB.meta.generated);P('    +-- automation_level: TBD');
  return L.join('\n');
}

/* ---------- componentes de UI ---------- */
const Btn=React.forwardRef(({primary,className,...p},ref)=>(
  <button ref={ref} {...p} className={cx('min-h-[40px] inline-flex items-center justify-center gap-2 px-3.5 rounded-md border text-sm font-medium cursor-pointer transition-colors',
    primary?'bg-pri border-pri text-white hover:bg-prih':'bg-surface border-line hover:bg-muted',className)}/>
));
const Badge=({active,children})=>(
  <span className={cx('min-h-[24px] inline-flex items-center px-2 rounded-full text-xs',active?'bg-pris text-pri':'bg-muted text-tx2')}>{children}</span>
);
const Label=({children,className})=><span className={cx('text-xs uppercase tracking-wider font-medium text-tx3',className)}>{children}</span>;
const Row=({label,children,cols='92px'})=>(
  <div className="grid gap-3 items-start text-sm leading-5" style={{gridTemplateColumns:cols+' minmax(0,1fr)'}}>
    <Label className="pt-px">{label}</Label><span>{children}</span>
  </div>
);

function SkillCard({k,onMore,onCopy}){
  const extra=k.vul.length>3?' +'+(k.vul.length-3):'';
  return (
    <article aria-label={k.title} className="flex flex-col gap-3.5 min-w-0 bg-surface border border-line rounded-lg p-5 hover:border-linestr">
      <div className="flex justify-between items-center gap-2">
        <span aria-hidden="true" className="w-7 h-7 rounded-md bg-muted grid place-items-center text-tx2 text-sm">◇</span>
        <Badge active>{k.status}</Badge>
      </div>
      <div>
        <div className="font-mono text-xs text-tx3 font-medium">{k.id} · {k.kind}</div>
        <h3 className="text-lg leading-6 font-semibold tracking-tight">{k.title}</h3>
      </div>
      <p className="text-sm leading-5 text-tx2 line-clamp-2">{k.desc}</p>
      <div className="grid gap-1.5">
        <Label>3Ps</Label>
        <Row label="Problema"><span className="line-clamp-2">{k.p}</span></Row>
        <Row label="Processo"><span className="line-clamp-2">{k.pr}</span></Row>
        <Row label="Progresso"><span className="line-clamp-2">{k.pg}</span></Row>
      </div>
      <div className="grid gap-1.5">
        <Label>Executar</Label>

      <Row label="Gestão">{k.gname}</Row>
      <Row label="Cognição">{k.cog}</Row>
      <Row label="Vulnerab.">{k.vul.slice(0,3).map(v=>v.nome).join(' · ')+extra}</Row>
      <Row label="Evidência">EVIDENCE_GAP</Row>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[13px] leading-[18px]">
        <div className="text-no">− Sem: {k.neg}</div>
        <div className="text-ok">+ Com: {k.pos}</div>
      </div>
      <div className="flex items-center justify-between gap-3 mt-auto pt-1 flex-wrap">
        <button onClick={()=>onCopy(k.cmd)} aria-label={'Copiar comando '+k.cmd}

        <button onClick={()=>onMore(k.id)} className="min-h-[44px] px-1 text-sm font-medium text-pri bg-transparent border-0 cursor-pointer">Ver mais →</button>
      </div>
    </article>
  );
}

function Sidebar({hash,open,onNavigate}){
  const link=(href,label,count)=>(
    <a href={href} onClick={onNavigate} aria-current={hash===href?'page':undefined}

}

function Overview(){
  return (
    <>
      <div className="mb-6">
        <div className="font-mono text-xs text-tx3">{DB.meta.catalog_id}</div>

        <p className="text-base leading-6 text-tx2 max-w-[760px] mt-1.5">Skills organizadas por área, com card de descoberta e detalhe em Plain Text ASCII. Escopo: {DB.meta.scope}.</p>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 border border-line rounded-lg overflow-hidden bg-surface mb-6">
        {[['Skills',DB.skills.length],['Áreas',DB.areas.length],['Plugins ativos',DB.plugins.length]].map(([l,v],i)=>(
          <div key={l} className={cx('p-5 min-h-[100px] border-linesub',i<2&&'border-b md:border-b-0 md:border-r')}>
            <div className="text-sm text-tx2">{l}</div>

          </div>))}
      </div>
      <div className="bg-waS border border-waB rounded-lg p-4 text-sm leading-5 mb-6">
        <strong>Estado dos dados.</strong> Áreas, funções de gestão, funções executivas e vulnerabilidades são classificação proposta, derivada das descrições. Nenhuma evidência clínica foi inventada: todas as skills estão como EVIDENCE_GAP. A expansão de PDCPA segue TBD.
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {DB.areas.map(a=>(
          <a key={a.id} href={'#/area/'+a.id.replace('AREA-','')} className="block no-underline text-tx bg-surface border border-line rounded-lg p-5 hover:border-linestr">

    </>
  );

function AreaPage({areaKey,onMore,onCopy}){
  const area=DB.areas.find(a=>a.id==='AREA-'+areaKey);
  const [q,setQ]=useState('');const [kind,setKind]=useState('');const [g,setG]=useState('');
  useEffect(()=>{setQ('');setKind('');setG('')},[areaKey]);
  const all=useMemo(()=>DB.skills.filter(s=>area&&s.area_id===area.id),[area]);
  const gs=useMemo(()=>[...new Set(all.map(s=>s.gname))],[all]);
  const list=useMemo(()=>{const t=q.toLowerCase();return all.filter(s=>(!kind||s.kind===kind)&&(!g||s.gname===g)&&(!t||(s.id+s.title+s.desc+s.cmd+s.src+s.p+s.pr+s.pg).toLowerCase().includes(t)))},[all,q,kind,g]);
  if(!area)return <div className="border border-line rounded-lg bg-surface min-h-[240px] grid place-items-center text-tx2">Área não encontrada.</div>;
  const inp='min-h-[40px] px-3 border border-line rounded-md bg-surface text-sm text-tx';
  return (
    <>
      <div className="text-sm text-tx2 mb-3"><a href="#/" className="text-inherit">Catálogo</a> / {area.title}</div>
      <div className="mb-6">
        <div className="font-mono text-xs text-tx3">{area.id}</div>
        <h1 className="text-[28px] leading-[34px] font-semibold tracking-tight">{area.title}</h1>
        <p className="text-base leading-6 text-tx2 max-w-[760px] mt-1.5">{area.desc}</p>
        <p className="text-sm text-tx2 mt-2" aria-live="polite">{list.length} de {area.count} skills</p>
      </div>
      <div className="flex flex-wrap gap-2 mb-5">
        <label className="sr-only" htmlFor="q">Buscar skills</label>
        <input id="q" type="search" placeholder="Buscar skills..." value={q} onChange={e=>setQ(e.target.value)} className={cx(inp,'flex-[1_1_260px]')}/>
        <label className="sr-only" htmlFor="fk">Tipo</label>
        <select id="fk" value={kind} onChange={e=>setKind(e.target.value)} className={inp}><option value="">Todos os tipos</option><option value="comando">Comando</option><option value="skill">Skill</option></select>
        <label className="sr-only" htmlFor="fg">Função de gestão</label>
        <select id="fg" value={g} onChange={e=>setG(e.target.value)} className={inp}><option value="">Toda gestão</option>{gs.map(x=><option key={x}>{x}</option>)}</select>
      </div>
      {list.length
        ? <div className="grid grid-cols-1 md:grid-cols-2 min-[1440px]:grid-cols-3 gap-4">{list.map(k=><SkillCard key={k.id} k={k} onMore={onMore} onCopy={onCopy}/>)}</div>
        : <div className="border border-line rounded-lg bg-surface min-h-[240px] grid place-items-center text-tx2 text-center p-6">Nenhuma skill encontrada com estes filtros.</div>}
    </>
  );
}

function PluginsPage(){
  return (
    <>
      <div className="text-sm text-tx2 mb-3"><a href="#/" className="text-inherit">Catálogo</a> / Plugins</div>
      <div className="mb-6">
        <h1 className="text-[28px] leading-[34px] font-semibold tracking-tight">Plugins ativos</h1>
        <p className="text-base leading-6 text-tx2 max-w-[760px] mt-1.5">Inventário dos {DB.plugins.length} plugins habilitados na conta. Skills EXECUTAR incluídas nesta entrega vêm dos plugins marcados.</p>
      </div>
      <div className="overflow-x-auto border border-line rounded-lg bg-surface">
        <table className="w-full border-collapse min-w-[720px]">
          <thead><tr>{['Plugin','Descrição','EXECUTAR','Skills no catálogo'].map(h=><th key={h} className="p-3.5 px-4 border-b border-linesub text-left text-sm font-medium text-tx2">{h}</th>)}</tr></thead>
          <tbody>{DB.plugins.map(p=>(
            <tr key={p.name} className="hover:bg-sub">
              <td className="p-3.5 px-4 border-b border-linesub align-top font-mono text-[13px] break-all">{p.name}</td>
              <td className="p-3.5 px-4 border-b border-linesub align-top text-sm leading-5">{p.desc}</td>
              <td className="p-3.5 px-4 border-b border-linesub align-top"><Badge active={p.executar}>{p.executar?'Incluído':'Próxima entrega'}</Badge></td>
              <td className="p-3.5 px-4 border-b border-linesub align-top text-sm">{p.skills}</td>
            </tr>))}</tbody>
        </table>
      </div>
    </>
  );
}

function Drawer({skill,onClose,onCopy}){
  const closeRef=useRef(null);
  useEffect(()=>{
    if(!skill)return;
    const prev=document.activeElement;closeRef.current&&closeRef.current.focus();
    const f=e=>{if(e.key==='Escape')onClose()};document.addEventListener('keydown',f);
    return()=>{document.removeEventListener('keydown',f);prev&&prev.focus&&prev.focus()};
  },[skill]);
  if(!skill)return null;
  const text=asciiDetail(skill);
  return (
    <>
      <div className="fixed inset-0 z-[60]" style={{background:'var(--scrim)'}} onClick={onClose}/>
      <aside role="dialog" aria-modal="true" aria-labelledby="dt" className="fixed top-0 right-0 bottom-0 z-[80] flex flex-col bg-surface w-full max-w-[720px] shadow-2xl">
        <div className="flex justify-between items-center gap-3 px-5 py-4 border-b border-linesub">
          <div className="min-w-0"><div className="font-mono text-xs text-tx3">{skill.id}</div><h2 id="dt" className="text-lg font-semibold">{skill.title}</h2></div>
          <div className="flex gap-2 shrink-0"><Btn onClick={()=>onCopy(text,'ASCII copiado')}>Copiar ASCII</Btn><Btn ref={closeRef} onClick={onClose} aria-label="Fechar">Fechar</Btn></div>
        </div>
        <div className="p-5 overflow-auto flex-1">
          <pre className="m-0 font-mono text-[13px] leading-5 whitespace-pre overflow-auto bg-sub border border-line rounded-lg p-4">{text}</pre>
        </div>
      </aside>
    </>
  );
}

function App(){
  const hash=useHash();
  const [open,setOpen]=useState(false);
  const [detail,setDetail]=useState(null);
  const [toast,setToast]=useState('');
  const th=useRef();
  const say=m=>{setToast(m);clearTimeout(th.current);th.current=setTimeout(()=>setToast(''),1800)};
  const doCopy=async(t,msg)=>{const ok=await copyText(t);say(ok?(msg||'Comando copiado'):'Não foi possível copiar')};
  useEffect(()=>{setOpen(false);window.scrollTo(0,0)},[hash]);
  const skill=detail?DB.skills.find(s=>s.id===detail):null;
  let page;
  if(hash.startsWith('#/area/'))page=<AreaPage areaKey={hash.slice(7)} onMore={setDetail} onCopy={doCopy}/>;
  else if(hash==='#/plugins')page=<PluginsPage/>;
  else page=<Overview/>;
  return (
    <>
      <header className="sticky top-0 z-20 h-16 flex items-center gap-3 px-5 border-b border-linesub bg-surface">
        <button className="lg:hidden min-w-[44px] min-h-[44px] bg-transparent border-0 text-tx cursor-pointer" aria-label="Abrir navegação" aria-expanded={open} onClick={()=>setOpen(o=>!o)}>☰</button>
        <div className="font-semibold text-base tracking-tight">EXECUTAR<small className="hidden sm:inline text-tx3 font-normal ml-2 text-xs">Catálogo de Skills</small></div>
      </header>
      <div className="grid grid-cols-1 lg:grid-cols-[288px_minmax(0,1fr)] min-h-[calc(100vh-64px)]">
        <Sidebar hash={hash} open={open} onNavigate={()=>setOpen(false)}/>
        <main className="min-w-0 w-full max-w-[1600px] mx-auto p-4 md:p-5 lg:p-8">{page}</main>
      </div>
      {open&&<div className="fixed inset-0 z-[60] lg:hidden" style={{background:'var(--scrim)'}} onClick={()=>setOpen(false)}/>}
      <Drawer skill={skill} onClose={()=>setDetail(null)} onCopy={doCopy}/>
      {toast&&<div role="status" className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] bg-tx text-canvas px-4 py-2.5 rounded-md text-sm">{toast}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

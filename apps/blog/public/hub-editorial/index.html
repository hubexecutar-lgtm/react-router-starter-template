<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Hub Editorial Risco Cognitivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ds/surfaces.css">
<style>
/* ===== Design tokens =====
   Neutros, ação e elevação vêm do contrato do blog (ADR-09) via /ds/surfaces.css,
   gerado de src/styles/global.css. Aqui ficam só as cores de estado do Hub, que
   têm função própria (sucesso, aviso, crítico, revisão). */
:root {
  --bg: var(--ds-surface-page);
  --surface: var(--ds-surface-default);
  --surface-2: var(--ds-surface-hover);
  --border: var(--ds-border-default);
  --border-strong: var(--ds-border-strong);
  --text: var(--ds-foreground);
  --muted: var(--ds-muted-foreground);
  --action: var(--ds-primary);
  --action-hover: color-mix(in oklch, var(--ds-primary) 86%, black);
  --action-tint: color-mix(in oklch, var(--ds-primary) 12%, var(--ds-surface-page));
  --nav-bg: var(--ds-surface-subtle);
  --card-shadow: var(--ds-elevation-flat);
  --overlay-shadow: var(--ds-elevation-overlay);
  --radius-sm: 6px;
  --radius-md: var(--ds-surface-radius-card);
  --radius-cell: var(--ds-table-radius);
  --success: #248A3D;
  --success-tint: #E6F4EA;
  --warning: #A05A00;
  --warning-tint: #FBF0DF;
  --critical: #D70015;
  --critical-tint: #FCE8E9;
  --review: #6E5AE6;
  --review-tint: #EEEBFB;
  --font-ui: "Segoe UI Variable", "Segoe UI", "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --success: #3DD160;
    --success-tint: #17301F;
    --warning: #FFB454;
    --warning-tint: #362408;
    --critical: #FF6B67;
    --critical-tint: #3A1517;
    --review: #A796F8;
    --review-tint: #241F3D;
  }
}
:root[data-theme="dark"] {
  --success: #3DD160;
  --success-tint: #17301F;
  --warning: #FFB454;
  --warning-tint: #362408;
  --critical: #FF6B67;
  --critical-tint: #3A1517;
  --review: #A796F8;
  --review-tint: #241F3D;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13.5px;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
::selection { background: var(--action-tint); }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ===== App shell ===== */
.app-shell { display: flex; height: 100vh; width: 100%; overflow: hidden; }

.nav-rail {
  width: 248px; flex-shrink: 0; background: var(--nav-bg); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden;
}
.app-shell.nav-collapsed .nav-rail { width: 64px; }

.nav-brand { display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px; position: relative; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px; background: var(--action); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; flex-shrink: 0;
  letter-spacing: 0.02em;
}
.brand-text { min-width: 0; }
.brand-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.nav-collapse-btn {
  margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; padding: 5px;
  border-radius: 6px; display: flex;
}
.nav-collapse-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-collapsed .nav-collapse-btn { margin-left: 0; position: absolute; right: 8px; top: 16px; }

.nav-groups { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
.nav-group { margin-bottom: 10px; }
.nav-group-title {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  padding: 10px 10px 4px;
}
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px;
  background: none; border: none; color: var(--text); cursor: pointer; text-align: left; font-size: 13px;
  margin-bottom: 1px; white-space: nowrap; overflow: hidden;
}
.nav-item .icon { flex-shrink: 0; color: var(--muted); }
.nav-item span { overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--action-tint); color: var(--action); font-weight: 600; }
.nav-item.active .icon { color: var(--action); }
.nav-count {
  margin-left: auto; font-size: 10.5px; color: var(--muted); background: var(--surface-2); border-radius: 20px;
  padding: 1px 6px; min-width: 16px; text-align: center; font-variant-numeric: tabular-nums;
}
.nav-item.active .nav-count { background: rgba(0,113,227,0.14); color: var(--action); }

.nav-footer { padding: 10px 14px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sync-dot.sync-on { background: var(--success); }
.sync-dot.sync-local { background: var(--warning); }
.theme-toggle {
  display: flex; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 2px; width: fit-content;
}
.theme-toggle button {
  background: none; border: none; color: var(--muted); cursor: pointer; padding: 5px 9px; border-radius: 6px;
  display: flex; align-items: center; font-size: 12px;
}
.theme-toggle button.active { background: var(--bg); color: var(--text); box-shadow: var(--card-shadow); }

/* ===== Main column ===== */
.main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.top-bar {
  height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; border-bottom: 1px solid var(--border);
}
.top-bar-title { font-size: 15px; font-weight: 600; }
.top-bar-actions { display: flex; align-items: center; gap: 8px; position: relative; }
.export-menu-wrap { position: relative; }
.export-menu {
  position: absolute; top: calc(100% + 6px); right: 0; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--overlay-shadow); min-width: 190px; z-index: 40; overflow: hidden;
  display: flex; flex-direction: column; padding: 4px;
}
.export-menu button {
  background: none; border: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font-size: 12.5px; color: var(--text); display: flex; align-items: center; gap: 7px;
}
.export-menu button:hover { background: var(--surface); }

.content-area { flex: 1; overflow: hidden; display: flex; }
.loading-state { padding: 40px; color: var(--muted); }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid transparent;
  padding: 7px 13px; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-primary { background: var(--action); color: var(--ds-primary-foreground); }
.btn-primary:hover { background: var(--action-hover); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger-ghost { background: none; color: var(--critical); border: 1px solid var(--critical-tint); }
.btn-danger-ghost:hover { background: var(--critical-tint); }

/* ===== Module master-detail ===== */
.module-view { display: flex; width: 100%; height: 100%; }
.master-col { width: 340px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.master-toolbar { display: flex; gap: 8px; padding: 14px 14px 8px; }
.search-wrap { position: relative; flex: 1; }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-input {
  width: 100%; padding: 7px 10px 7px 30px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface);
  outline: none;
}
.search-input:focus { border-color: var(--action); background: var(--bg); box-shadow: 0 0 0 3px var(--action-tint); }
.master-count { padding: 0 14px 8px; font-size: 11px; color: var(--muted); }
.master-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.master-row {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: none;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
}
.master-row:hover { background: var(--surface); }
.master-row.active { background: var(--action-tint); }
.master-row-main { min-width: 0; flex: 1; }
.master-row-title {
  font-size: 12.8px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4;
}
.master-row.active .master-row-title { color: var(--action); }
.master-row-sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { color: var(--muted); flex-shrink: 0; }
.empty-state { padding: 30px 14px; text-align: center; color: var(--muted); font-size: 12.5px; }
.empty-state p { margin: 0 0 10px; }

.detail-col { flex: 1; overflow-y: auto; min-width: 0; }
.detail-panel { max-width: 720px; padding: 22px 28px 60px; }
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.detail-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.detail-title { font-size: 19px; font-weight: 650; margin-top: 3px; text-wrap: balance; }
.detail-actions { display: flex; gap: 6px; }

.f-row { margin-bottom: 14px; }
.f-label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.f-input {
  width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface);
  outline: none; color: var(--text);
}
.f-input:focus { border-color: var(--action); background: var(--bg); box-shadow: 0 0 0 3px var(--action-tint); }
.f-input.f-readonly { color: var(--muted); background: var(--surface); font-family: var(--font-mono); font-size: 12px; }
.f-textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
select.f-input { appearance: none; background-image: none; cursor: pointer; }

.detail-footer {
  display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid var(--border); margin-top: 6px;
  position: sticky; bottom: 0; background: var(--bg);
}
.spacer { flex: 1; }
.detail-placeholder {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); font-size: 13px; text-align: center; padding: 40px;
}
.detail-placeholder .icon { color: var(--border); }
.detail-placeholder p { max-width: 260px; margin: 0; }

/* ===== Pills ===== */
.pill {
  display: inline-flex; align-items: center; font-size: 10.8px; font-weight: 600; padding: 2.5px 8px; border-radius: 20px;
  white-space: nowrap; letter-spacing: 0.01em;
}
.pill-empty { color: var(--muted); background: var(--surface-2); }
.tone-action { color: var(--action); background: var(--action-tint); }
.tone-success { color: var(--success); background: var(--success-tint); }
.tone-warning { color: var(--warning); background: var(--warning-tint); }
.tone-critical { color: var(--critical); background: var(--critical-tint); }
.tone-review { color: var(--review); background: var(--review-tint); }
.tone-muted { color: var(--muted); background: var(--surface-2); }

/* ===== Config lists ===== */
.config-view { padding: 24px 28px 60px; max-width: 1000px; overflow-y: auto; height: 100%; }
.config-intro h2 { margin: 0 0 6px; font-size: 18px; }
.config-intro p { margin: 0 0 20px; color: var(--muted); max-width: 62ch; line-height: 1.55; }
.config-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.config-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; background: var(--surface); }
.config-card-title { font-weight: 600; font-size: 12.8px; margin-bottom: 10px; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 4px 3px 10px; font-size: 11.5px;
}
.chip-x { background: none; border: none; color: var(--muted); cursor: pointer; display: flex; padding: 3px; border-radius: 50%; }
.chip-x:hover { background: var(--surface-2); color: var(--critical); }
.config-add-row { display: flex; gap: 6px; }
.config-add-row .f-input { padding: 6px 9px; font-size: 12px; }

/* ===== Dashboard ===== */
.dashboard { padding: 22px 28px 50px; overflow-y: auto; height: 100%; width: 100%; }
.stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 26px; }
.stat-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; background: var(--surface); }
.stat-num { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-label { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.dash-section { margin-bottom: 26px; }
.dash-section-title { font-size: 12.5px; font-weight: 650; margin-bottom: 10px; }
/* Tabela segmentada (STORE-WIREFRAMES / ADR-09): células cinza separadas, sem bordas. */
.dash-table-wrap { overflow-x: auto; }
.dash-table {
  width: calc(100% + 2 * var(--ds-table-gap)); margin-inline: calc(var(--ds-table-gap) * -1);
  border-collapse: separate; border-spacing: var(--ds-table-gap); font-size: 12.2px;
}
.dash-table th {
  text-align: left; font-weight: 600; color: var(--text); padding: 9px 12px; background: var(--ds-table-head-surface);
  border-radius: var(--radius-cell); white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
}
.dash-table td { padding: 9px 12px; background: var(--surface); border-radius: var(--radius-cell); vertical-align: top; }
.dash-table tr.clickable { cursor: pointer; }
.dash-table tr.clickable:hover td { background: var(--surface-2); }
.dash-title-cell { max-width: 260px; }
.muted-cell { color: var(--muted); max-width: 220px; }
.num-cell { text-align: right; font-variant-numeric: tabular-nums; }
.empty-cell { color: var(--muted); text-align: center; padding: 20px; }

.dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.bar-list { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 24px; align-items: center; gap: 10px; }
.bar-label { min-width: 0; }
.bar-track { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--action); border-radius: 4px; }
.bar-num { font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

.module-count-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.module-count-card {
  display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer; text-align: left;
}
.module-count-card:hover { background: var(--surface-2); }
.module-count-card .icon { color: var(--muted); flex-shrink: 0; }
.mc-label { font-size: 11.8px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-num { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ===== Sobre ===== */
.sobre-view { padding: 26px 28px 60px; max-width: 680px; overflow-y: auto; height: 100%; line-height: 1.6; }
.sobre-view h2 { font-size: 19px; margin: 0 0 12px; }
.sobre-view h3 { font-size: 13.5px; margin: 26px 0 10px; }
.sobre-view p { color: var(--text); margin: 0 0 8px; }
.sobre-list { padding-left: 20px; margin: 0; color: var(--text); }
.sobre-list li { margin-bottom: 6px; }
.token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.token-card { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 8px; padding: 9px; }
.token-swatch { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; border: 1px solid var(--border); }
.token-name { font-size: 12px; font-weight: 600; }
.token-hex { font-size: 11px; color: var(--muted); }

/* ===== Scrollbars ===== */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 20px; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media (max-width: 980px) {
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .dash-cols { grid-template-columns: 1fr; }
}

</style>

</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, Fragment } = React;

/* ---------- ID generation ---------- */
function nextId(records, idField, prefix, pad) {
  let max = 0;
  for (const r of records) {
    const v = r[idField];
    if (typeof v === "string" && v.startsWith(prefix)) {
      const n = parseInt(v.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  }
  return prefix + String(max + 1).padStart(pad, "0");
}

function uid() {
  return "r" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

/* ---------- Data layer: db capability with localStorage fallback ---------- */
function useCmsData(MODULES, SEED) {
  const [db, setDb] = useState(undefined); // undefined = checking, null = unavailable, object = ready
  const [downloads, setDownloads] = useState(undefined);
  const [data, setData] = useState(() => {
    // local fallback initial state
    const initial = {};
    for (const m of MODULES) {
      try {
        const raw = localStorage.getItem("rc_cms_" + m.id);
        initial[m.id] = raw ? JSON.parse(raw) : (SEED[m.id] || []).map((r) => ({ _id: uid(), ...r }));
      } catch (e) {
        initial[m.id] = (SEED[m.id] || []).map((r) => ({ _id: uid(), ...r }));
      }
    }
    return initial;
  });
  const [ready, setReady] = useState(false);
  const unsubsRef = useRef([]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let claudeDb = null;
      let claudeDownloads = null;
      try {
        if (window.claude && window.claude.use) {
          claudeDb = await window.claude.use("db");
          claudeDownloads = await window.claude.use("downloads");
        }
      } catch (e) {
        claudeDb = null;
      }
      if (cancelled) return;
      setDownloads(claudeDownloads || null);
      if (!claudeDb) {
        setDb(null);
        setReady(true);
        return;
      }
      setDb(claudeDb);
      // subscribe to each module collection; seed if empty & unseeded
      for (const m of MODULES) {
        try {
          const metaRef = claudeDb.doc("_meta/seed_" + m.id);
          const metaSnap = await metaRef.get().catch(() => null);
          const alreadySeeded = metaSnap && metaSnap.exists;
          if (!alreadySeeded) {
            const rows = SEED[m.id] || [];
            for (const row of rows) {
              const rid = uid();
              await claudeDb.doc("m_" + m.id + "/" + rid).set(row).catch(() => {});
            }
            await metaRef.set({ done: true }).catch(() => {});
          }
        } catch (e) {
          /* ignore per-module seed errors */
        }
        try {
          const unsub = claudeDb.collection("m_" + m.id).onSnapshot((snap) => {
            const rows = snap.docs.map((d) => ({ _id: d.id, ...d.data() }));
            setData((prev) => ({ ...prev, [m.id]: rows }));
          });
          unsubsRef.current.push(unsub);
        } catch (e) {
          /* ignore */
        }
      }
      setReady(true);
    })();
    return () => {
      cancelled = true;
      unsubsRef.current.forEach((u) => {
        try {
          u && u();
        } catch (e) {}
      });
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // local persistence whenever data changes and db is unavailable
  useEffect(() => {
    if (db !== null) return;
    for (const m of MODULES) {
      try {
        localStorage.setItem("rc_cms_" + m.id, JSON.stringify(data[m.id] || []));
      } catch (e) {}
    }
  }, [data, db, MODULES]);

  const addRecord = useCallback(
    async (moduleId, fields) => {
      const rid = uid();
      if (db) {
        await db.doc("m_" + moduleId + "/" + rid).set(fields).catch(() => {});
      } else {
        setData((prev) => ({ ...prev, [moduleId]: [...(prev[moduleId] || []), { _id: rid, ...fields }] }));
      }
      return rid;
    },
    [db]
  );

  const updateRecord = useCallback(
    async (moduleId, id, patch) => {
      if (db) {
        await db.doc("m_" + moduleId + "/" + id).update(patch).catch(() => {});
      } else {
        setData((prev) => ({
          ...prev,
          [moduleId]: (prev[moduleId] || []).map((r) => (r._id === id ? { ...r, ...patch } : r)),
        }));
      }
    },
    [db]
  );

  const deleteRecord = useCallback(
    async (moduleId, id) => {
      if (db) {
        await db.doc("m_" + moduleId + "/" + id).delete().catch(() => {});
      } else {
        setData((prev) => ({ ...prev, [moduleId]: (prev[moduleId] || []).filter((r) => r._id !== id) }));
      }
    },
    [db]
  );

  const resetModule = useCallback(
    async (moduleId) => {
      const rows = SEED[moduleId] || [];
      if (db) {
        const existing = data[moduleId] || [];
        for (const r of existing) {
          await db.doc("m_" + moduleId + "/" + r._id).delete().catch(() => {});
        }
        for (const row of rows) {
          await db.doc("m_" + moduleId + "/" + uid()).set(row).catch(() => {});
        }
      } else {
        setData((prev) => ({ ...prev, [moduleId]: rows.map((r) => ({ _id: uid(), ...r })) }));
      }
    },
    [db, data]
  );

  return { data, addRecord, updateRecord, deleteRecord, resetModule, ready, mode: db ? "sync" : "local", downloads };
}

/* ---------- Field helpers ---------- */
function parseFieldType(type) {
  if (type.startsWith("select:")) return { kind: "select", vocab: type.slice(7) };
  if (type.startsWith("ref:")) return { kind: "ref", module: type.slice(4) };
  return { kind: type };
}

function recordTitle(mod, rec) {
  if (!rec) return "";
  let t = rec[mod.titleField] || (mod.titleField2 && rec[mod.titleField2]) || "";
  if (!t && mod.keyField) t = rec[mod.keyField] || "";
  return t || "(sem título)";
}

function findRecord(data, moduleId, id) {
  return (data[moduleId] || []).find((r) => r._id === id || r[MODULES_BY_ID[moduleId].idField] === id);
}

/* ---------- Status pill ---------- */
const STATUS_TONE = {
  IDEIA: "muted", TRIAGEM: "muted", APROVADA: "success", PESQUISA: "review", "ARGUMENTAÇÃO": "review",
  RASCUNHO: "muted", "EM PRODUÇÃO": "action", "EM REVISÃO": "warning", ACEITO: "success", VALIDADA: "success",
  "DERIVAÇÃO": "action", PRONTO: "success", AGENDADO: "action", PUBLICADO: "success", "RECIRCULAÇÃO": "action",
  ATUALIZAR: "warning", ARQUIVADO: "muted", BLOQUEADO: "critical", PLANEJADO: "muted", BRIEF: "muted",
  DECIDIDA: "success", PENDENTE: "warning", "EM ANÁLISE": "review",
  "CRÍTICA": "critical", ALTA: "warning", "MÉDIA": "action", BAIXA: "muted",
};
function StatusPill({ value }) {
  if (!value) return <span className="pill pill-empty">—</span>;
  const tone = STATUS_TONE[value] || "muted";
  return <span className={"pill tone-" + tone}>{value}</span>;
}

/* ---------- Field renderer (form) ---------- */
function FieldInput({ field, value, onChange, data, MODULES, VOCAB, autoFocus }) {
  const [key, label, typeRaw] = field;
  const t = parseFieldType(typeRaw);
  if (t.kind === "id") {
    return <input className="f-input f-readonly" value={value || ""} readOnly tabIndex={-1} />;
  }
  if (t.kind === "longtext") {
    return (
      <textarea className="f-input f-textarea" value={value || ""} rows={3}
        onChange={(e) => onChange(e.target.value)} autoFocus={autoFocus} />
    );
  }
  if (t.kind === "number") {
    return (
      <input className="f-input" type="number" value={value === undefined || value === null ? "" : value}
        onChange={(e) => onChange(e.target.value === "" ? "" : Number(e.target.value))} autoFocus={autoFocus} />
    );
  }
  if (t.kind === "date") {
    return <input className="f-input" type="date" value={value || ""} onChange={(e) => onChange(e.target.value)} />;
  }
  if (t.kind === "url") {
    return <input className="f-input" type="url" placeholder="https://…" value={value || ""}
      onChange={(e) => onChange(e.target.value)} autoFocus={autoFocus} />;
  }
  if (t.kind === "select") {
    const options = VOCAB[t.vocab] || [];
    const listId = "dl-" + t.vocab;
    return (
      <Fragment>
        <input className="f-input" list={listId} value={value || ""} onChange={(e) => onChange(e.target.value)} autoFocus={autoFocus} />
        <datalist id={listId}>
          {options.map((o) => (
            <option value={o} key={o} />
          ))}
        </datalist>
      </Fragment>
    );
  }
  if (t.kind === "ref") {
    const mod = MODULES_BY_ID[t.module];
    const records = data[t.module] || [];
    return (
      <select className="f-input" value={value || ""} onChange={(e) => onChange(e.target.value)}>
        <option value="">—</option>
        {records.map((r) => {
          const idVal = mod.idField ? r[mod.idField] : r._id;
          return (
            <option value={idVal} key={r._id}>
              {(mod.idField ? idVal + " — " : "") + recordTitle(mod, r)}
            </option>
          );
        })}
      </select>
    );
  }
  return <input className="f-input" value={value || ""} onChange={(e) => onChange(e.target.value)} autoFocus={autoFocus} />;
}

/* ---------- Generic module master-detail view ---------- */
function ModuleView({ mod, cms, MODULES, VOCAB }) {
  const records = cms.data[mod.id] || [];
  const [selectedId, setSelectedId] = useState(null);
  const [creating, setCreating] = useState(false);
  const [query, setQuery] = useState("");

  useEffect(() => {
    setSelectedId(null);
    setCreating(false);
    setQuery("");
  }, [mod.id]);

  const filtered = useMemo(() => {
    if (!query.trim()) return records;
    const q = query.toLowerCase();
    return records.filter((r) => JSON.stringify(r).toLowerCase().includes(q));
  }, [records, query]);

  const selected = records.find((r) => r._id === selectedId);

  const blankDraft = useMemo(() => {
    const d = {};
    mod.fields.forEach(([key]) => (d[key] = ""));
    if (mod.idField) d[mod.idField] = nextId(records, mod.idField, mod.idPrefix, 4);
    return d;
  }, [mod, records, creating]);

  const handleCreate = async (draft) => {
    const clean = { ...draft };
    delete clean._id;
    await cms.addRecord(mod.id, clean);
    setCreating(false);
  };
  const handleSave = async (draft) => {
    const clean = { ...draft };
    const id = clean._id;
    delete clean._id;
    await cms.updateRecord(mod.id, id, clean);
  };
  const handleDelete = async (id) => {
    if (!confirm("Excluir este registro? Esta ação não pode ser desfeita.")) return;
    await cms.deleteRecord(mod.id, id);
    setSelectedId(null);
  };

  return (
    <div className="module-view">
      <div className="master-col">
        <div className="master-toolbar">
          <div className="search-wrap">
            <Icon name="search" size={15} className="search-icon" />
            <input className="search-input" placeholder={"Buscar em " + mod.plural.toLowerCase() + "…"}
              value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <button className="btn btn-primary btn-sm" onClick={() => { setCreating(true); setSelectedId(null); }}>
            <Icon name="plus" size={15} /> Novo
          </button>
        </div>
        <div className="master-count">{filtered.length} de {records.length} {mod.plural.toLowerCase()}</div>
        <div className="master-list">
          {filtered.length === 0 && (
            <div className="empty-state">
              <p>Nenhum registro ainda.</p>
              <button className="btn btn-ghost btn-sm" onClick={() => { setCreating(true); setSelectedId(null); }}>
                <Icon name="plus" size={14} /> Criar o primeiro
              </button>
            </div>
          )}
          {filtered.map((r) => (
            <button key={r._id} className={"master-row" + (r._id === selectedId ? " active" : "")}
              onClick={() => { setSelectedId(r._id); setCreating(false); }}>
              <div className="master-row-main">
                <div className="master-row-title">{recordTitle(mod, r)}</div>
                {mod.subtitleField && r[mod.subtitleField] ? (
                  <div className="master-row-sub">{r[mod.subtitleField]}</div>
                ) : null}
              </div>
              {(() => {
                const statusField = mod.fields.find(([k]) => k === "Status" || k === "Status_editorial" || k === "Status_brief");
                const v = statusField ? r[statusField[0]] : null;
                return v ? <StatusPill value={v} /> : <Icon name="chevronRight" size={14} className="chev" />;
              })()}
            </button>
          ))}
        </div>
      </div>
      <div className="detail-col">
        {creating ? (
          <DetailPanel mod={mod} record={{ _id: "__new__", ...blankDraft }} data={cms.data} MODULES={MODULES} VOCAB={VOCAB}
            onSave={handleCreate} onDelete={() => {}} onClose={() => setCreating(false)} isNew />
        ) : selected ? (
          <DetailPanel key={selected._id} mod={mod} record={selected} data={cms.data} MODULES={MODULES} VOCAB={VOCAB}
            onSave={handleSave} onDelete={handleDelete} onClose={() => setSelectedId(null)} isNew={false} />
        ) : (
          <div className="detail-placeholder">
            <Icon name={mod.icon} size={30} />
            <p>Selecione um registro à esquerda ou crie um novo {mod.singular.toLowerCase()}.</p>
          </div>
        )}
      </div>
    </div>
  );
}

function ConfigListsView({ vocab, setVocab }) {

    statusVisual: "Status visual", tipoEvidencia: "Tipo de evidência", statusDecisao: "Status de decisão",
    tipoDistribuicao: "Tipo de distribuição",
  };

    const v = (newItems[k] || "").trim();
    if (!v) return;
    setVocab((prev) => ({ ...prev, [k]: prev[k].includes(v) ? prev[k] : [...prev[k], v] }));
    setNewItems((p) => ({ ...p, [k]: "" }));
  };
  const removeItem = (k, item) => {
    setVocab((prev) => ({ ...prev, [k]: prev[k].filter((x) => x !== item) }));
  };
  return (
    <div className="config-view">

/* ---------- Export helpers ---------- */
function toCSV(rows, fields) {
  const headers = fields.map(([, label]) => label);
  const keys = fields.map(([key]) => key);
  const esc = (v) => {
    if (v === undefined || v === null) v = "";
    v = String(v);
    if (/[",\n;]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  };
  const lines = [headers.map(esc).join(",")];
  rows.forEach((r) => lines.push(keys.map((k) => esc(r[k])).join(",")));
  return lines.join("\n");
}

        { id: "shorts", label: "Shorts & Reels", icon: "shorts" },
        { id: "social", label: "Social cross-platform", icon: "social" },
        { id: "newsletter", label: "Newsletter", icon: "newsletter" },
      ],
    },
    {
      title: "Publicação",
      items: [
        { id: "seo", label: "SEO & metadados", icon: "seo" },
        { id: "calendar", label: "Calendário", icon: "calendar" },
        { id: "distribution", label: "Distribuição", icon: "distribution" },
        { id: "performance", label: "Performance", icon: "performance" },
      ],
    },
    {
      title: "Estratégia",
      items: [
        { id: "backlog", label: "Backlog de ideias", icon: "backlog" },
        { id: "taxonomy", label: "Taxonomia", icon: "taxonomy" },
        { id: "decisions", label: "Log de decisões", icon: "decisions" },
      ],
    },
    { title: null, items: [
        { id: "config", label: "Listas controladas", icon: "config" },
        { id: "sobre", label: "Sobre", icon: "about" },
      ] },
  ];

  const currentMod = MODULES_BY_ID[route];

  const handleNavigate = (moduleId) => {
    setRoute(moduleId);
    setPendingSelect(null);
  };
  const handleDashNavigate = (moduleId, recordId) => {
    setRoute(moduleId);
    setPendingSelect(recordId);
  };

  const exportAllJSON = async () => {
    const payload = {};
    MODULES.forEach((m) => (payload[m.id] = (cms.data[m.id] || []).map(({ _id, ...rest }) => rest)));
    const json = JSON.stringify({ vocab, data: payload }, null, 2);
    if (cms.downloads) {
      await cms.downloads.save({ filename: "risco-cognitivo-hub-editorial.json", data: json }).catch(() => {});
    } else {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }
  };

  const exportModuleCSV = async (mod) => {
    const csv = toCSV(cms.data[mod.id] || [], mod.fields);
    if (cms.downloads) {
      await cms.downloads.save({ filename: mod.sheet + ".csv", data: csv }).catch(() => {});
    } else {
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }
  };

  const fileInputRef = useRef(null);
  const importJSON = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.vocab) setVocab(parsed.vocab);
        if (parsed.data) {
          for (const m of MODULES) {
            const rows = parsed.data[m.id];
            if (!rows) continue;
            const existing = cms.data[m.id] || [];
            for (const r of existing) await cms.deleteRecord(m.id, r._id);
            for (const row of rows) await cms.addRecord(m.id, row);
          }
        }
        alert("Importação concluída.");
      } catch (err) {
        alert("Arquivo inválido: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className={"app-shell" + (navCollapsed ? " nav-collapsed" : "")}>
      <aside className="nav-rail">
        <div className="nav-brand">
          <div className="brand-mark">RC</div>
          {!navCollapsed && (
            <div className="brand-text">
              <div className="brand-title">Risco Cognitivo</div>
              <div className="brand-sub">Hub Editorial</div>
            </div>
          )}
          <button className="nav-collapse-btn" onClick={() => setNavCollapsed((v) => !v)} title="Recolher menu">
            <Icon name={navCollapsed ? "chevronRight" : "chevronLeft"} size={15} />
          </button>
        </div>
        <nav className="nav-groups">
          {navGroups.map((g, gi) => (
            <div className="nav-group" key={gi}>
              {g.title && !navCollapsed && <div className="nav-group-title">{g.title}</div>}
              {g.items.map((it) => (
                <button key={it.id} className={"nav-item" + (route === it.id ? " active" : "")}
                  onClick={() => handleNavigate(it.id)} title={it.label}>
                  <Icon name={it.icon} size={17} />
                  {!navCollapsed && <span>{it.label}</span>}
                  {!navCollapsed && MODULES_BY_ID[it.id] && (
                    <span className="nav-count">{(cms.data[it.id] || []).length}</span>
                  )}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div className="nav-footer">
          <div className="sync-indicator" title={cms.mode === "sync" ? "Sincronizado" : "Salvo neste navegador"}>
            <span className={"sync-dot " + (cms.mode === "sync" ? "sync-on" : "sync-local")} />
            {!navCollapsed && <span>{cms.mode === "sync" ? "Sincronizado" : "Local"}</span>}
          </div>
          <div className="theme-toggle">
            <button className={theme === "light" ? "active" : ""} onClick={() => setTheme("light")} title="Claro"><Icon name="sun" size={14} /></button>
            <button className={theme === "system" ? "active" : ""} onClick={() => setTheme("system")} title="Sistema">·</button>
            <button className={theme === "dark" ? "active" : ""} onClick={() => setTheme("dark")} title="Escuro"><Icon name="moon" size={14} /></button>
          </div>
        </div>
      </aside>

      <main className="main-col">
        <header className="top-bar">
          <div className="top-bar-title">
            {route === "dashboard" ? "Dashboard" : route === "config" ? "Listas controladas" : route === "sobre" ? "Sobre" : currentMod ? currentMod.label : ""}
          </div>
          <div className="top-bar-actions">
            <div className="export-menu-wrap">
              <button className="btn btn-ghost btn-sm" onClick={() => setExportOpen((v) => !v)}>
                <Icon name="download" size={15} /> Exportar
              </button>
              {exportOpen && (
                <div className="export-menu" onMouseLeave={() => setExportOpen(false)}>
                  <button onClick={() => { exportAllJSON(); setExportOpen(false); }}>Tudo (JSON)</button>
                  {currentMod && (
                    <button onClick={() => { exportModuleCSV(currentMod); setExportOpen(false); }}>
                      {currentMod.label} (CSV)
                    </button>
                  )}
                  <button onClick={() => { fileInputRef.current && fileInputRef.current.click(); setExportOpen(false); }}>
                    <Icon name="upload" size={13} /> Importar JSON…
                  </button>
                </div>
              )}
            </div>
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJSON} />
          </div>
        </header>
        <div className="content-area">
          {!cms.ready ? (
            <div className="loading-state">Carregando…</div>
          ) : route === "dashboard" ? (
            <Dashboard cms={cms} MODULES={MODULES} onNavigate={handleDashNavigate} />
          ) : route === "config" ? (
            <ConfigListsView vocab={vocab} setVocab={setVocab} />
          ) : route === "sobre" ? (
            <SobreView tokens={TOKENS} />
          ) : currentMod ? (
            <ModuleView mod={currentMod} cms={cms} MODULES={MODULES} VOCAB={vocab} key={currentMod.id} />
          ) : null}
        </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

</body></html>

schema_id: EXECUTAR-UNIFIED-CORRELATION-001
version: 0.1.0
status: PROPOSED_FOR_APPROVAL
model: typed_property_graph
principles:
- ids_stable
- source_native_schema_preserved
- projection_is_not_source
- edge_requires_provenance
- inference_must_be_explicit
- clinical_association_is_not_product_causality
- missing_is_null_or_TBD_never_invented
- target_is_not_observed
epistemics:
  provenance_class:
    A_OBSERVED: Resultado observado/testado.
    B_PRIMARY: Fonte primária/oficial.
    C_PUBLISHED: Síntese publicada/secundária.
    D_INTERNAL: Documento/decisão interna.
    E_INFERRED: Correlação/hipótese/recomendação derivada.
  claim_role:
  - FACT
  - OFFICIAL_GUIDANCE
  - SYNTHESIS
  - FRAMEWORK
  - HYPOTHESIS
  - PRODUCT_DECISION
  - RECOMMENDATION
  native_class_preserved: true
node_types:
  OBJECTIVE: Resultado/objetivo protegido.
  CONTEXT: Público, situação, ambiente, restrições.
  PROBLEM: Dor/estado observável sem antecipar solução.
  CONCEPT: Conceito explicado/ensinado.
  OPERATIONAL_FUNCTION: Função de gestão/execução.
  COGNITIVE_CAPACITY: Capacidade humana exigida.
  RISK_FACTOR: Fator/condição que pode elevar demanda cognitiva.
  NEURODIVERGENCE_PROFILE: Perfil populacional apenas para associação baseada em evidência.
  VULNERABILITY: Vulnerabilidade relevante ao objetivo/contexto.
  EXPOSURE: Contato/intensidade contextual.
  RISK: Risco de execução conforme framework.
  OPERATIONAL_IMPACT: Erro, atraso, omissão, retrabalho, perda de contexto etc.
  COMPENSATION: Princípio compensatório.
  CONTROL: Controle preventivo/detectivo/corretivo.
  METHOD: Método/framework/processo.
  SOLUTION: Objeto ofertável/acionável.
  CAPABILITY: Capacidade funcional executável.
  APP_FEATURE: Feature integrada do EXECUTAR.
  KNOWLEDGE_PACK: Unidade governada de conhecimento.
  QUICK_FRAMEWORK: Projeção pesquisada/didática.
  LEARNING_OBJECT: Projeção didática EDU.
  CLAIM: Afirmação endereçável.
  EVIDENCE: Fonte/estudo/norma/documento.
  ASSET: Artigo, vídeo, infográfico, checklist, prompt, download etc.
  EXECUTION: Instância de uso.
  EVENT: Evento observável.
  METRIC: Indicador calculado.
  LEARNING: Aprendizado documentado.
relation_types:
- OCCURS_IN
- SERVES_OBJECTIVE
- IMPACTS_FUNCTION
- REQUIRES_CAPACITY
- INCREASES_DEMAND_ON
- ASSOCIATED_WITH
- MODULATES
- CONTRIBUTES_TO
- MAY_PRODUCE
- ADDRESSES
- MITIGATES
- IMPLEMENTS
- EXPOSES_CAPABILITY
- INTEGRATES
- EXPLAINS
- SUPPORTED_BY
- CONTAINS
- DERIVES_FROM
- RECOMMENDS
- CTA_TO
- INVOKES
- EMITS
- AGGREGATED_BY
- UPDATES
- TEACHES
node_contract:
  required:
  - id
  - type
  - label
  - status
  - source_refs
  status:
  - DRAFT
  - PROPOSED
  - DEFINED
  - VALIDATED
  - DEPRECATED
edge_contract:
  required:
  - id
  - type
  - source
  - target
  - status
  - epistemic
  - evidence_refs
  status:
  - PROPOSED
  - VALIDATED
  - REJECTED
  - DEPRECATED
projection_types:
  quick_framework:
    source: executar-block-quick-frameworks
    role: explain/research
  solution_store:
    source: SUPER_SCHEMA_SOLUTION
    role: deliver/execute
  knowledge_pack:
    source: RC-KNW
    role: govern knowledge/evidence
  education:
    source: EDU-FORM-001
    role: teach
  runtime:
    source: PRD-EXEC-DISPATCH-004
    role: select/execute/measure

name: Workflow app CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/workflow/**"
      - ".claude/**"
      - "plugins/**"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (raiz do monorepo, lockfile único)
        run: npm ci
      - name: Generate AI registry
        run: npm run registry:generate -w apps/workflow
      - name: TypeScript
        run: npx tsc -b
        working-directory: apps/workflow
      - name: Tests
        run: npm test -w apps/workflow
      - name: Production build
        run: npm run build -w apps/workflow

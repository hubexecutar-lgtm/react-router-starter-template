name: Workflow app CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/workflow/**"
      - ".claude/**"
      - "plugins/**"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (raiz do monorepo, lockfile único)
        run: npm ci
      - name: Pré-voo do agente (offline)
        run: npm run doctor -w apps/workflow -- --offline
      - name: Pré-voo em JSON (ok = true)
        run: node apps/workflow/scripts/doctor.mjs --offline --json | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!r.ok||!r.results.length) process.exit(1)'
      - name: Autoteste do bootstrap (wrangler simulado)
        run: npm run bootstrap:selftest -w apps/workflow
      - name: Generate AI registry
        run: npm run registry:generate -w apps/workflow
      - name: TypeScript
        run: npx tsc -b
        working-directory: apps/workflow
      - name: Tests
        run: npm test -w apps/workflow
      - name: Production build
        run: npm run build -w apps/workflow
